[package]
name = "kestrel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File manager with instant whole-disk search (Everything + Files for Linux)"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
kestrel-index = { path = "../kestrel-index" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", default-features = false }
libc = "0.2"
regex = "1"
vte4 = "0.10"
pulldown-cmark = { version = "0.13.5", default-features = false }
lofty = "0.25.5"
gstreamer = "0.25"

[package.metadata.deb]
name = "kestrel"
maintainer = "Stolly345 <114888417+Stolly345@users.noreply.github.com>"
copyright = "2026, Alex Stoll"
extended-description = """\
Kestrel pairs Everything's instant whole-disk search (a root daemon indexing \
every local filesystem, kept live with fanotify, results filtered to what the \
asking user may see) with a Files-style GTK4 file manager: tabs, dual pane, \
details/grid/column views, preview pane, git status, color tags and a command \
palette. Includes the `ks` command-line search client."""
section = "utils"
priority = "optional"
depends = "$auto, bubblewrap, tar, gzip, xz-utils, bzip2, zstd, gvfs, xdg-utils, pkexec"
conflicts = "chimera"
replaces = "chimera"
recommends = "gstreamer1.0-libav, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, ncompress, gvfs-backends, xdg-terminal-exec, poppler-utils, libreoffice-writer, libreoffice-calc, libreoffice-impress"
conf-files = ["/etc/kestrel/excludes"]
maintainer-scripts = "../../packaging/debian/"
assets = [
    ["target/release/kestrel", "usr/bin/", "755"],
    ["target/release/kestrel-indexd", "usr/bin/", "755"],
    ["target/release/ks", "usr/bin/", "755"],
    ["../../packaging/excludes", "etc/kestrel/excludes", "644"],
    ["../../packaging/dev.kestrel.Kestrel.desktop", "usr/share/applications/", "644"],
    ["../../packaging/dev.kestrel.Kestrel.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/kestrel-mime.xml", "usr/share/mime/packages/kestrel.xml", "644"],
    ["../../PLAN.md", "usr/share/doc/kestrel/PLAN.md", "644"],
    ["../../packaging/7zip/7zz", "usr/lib/kestrel/7zz", "755"],
    ["../../packaging/7zip/License.txt", "usr/share/doc/kestrel/7zip-License.txt", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/kestrel/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/kestrel/LICENSE-APACHE", "644"],
    ["../../packaging/THIRD-PARTY-LICENSES.txt", "usr/share/doc/kestrel/THIRD-PARTY-LICENSES.txt", "644"],
]

[package.metadata.deb.systemd-units]
unit-scripts = "../../packaging"
unit-name = "kestrel-indexd"
enable = true
start = true
restart-after-upgrade = true

# `cargo generate-rpm -p crates/kestrel` after `cargo build --release`. Library requirements come
# from the binaries' sonames (auto-req), so no distro package names to keep in step.
[package.metadata.generate-rpm]
name = "kestrel"
summary = "File manager with instant whole-disk search (Everything + Files for Linux)"
release = "1"
post_install_script = "../../packaging/rpm/post"
pre_uninstall_script = "../../packaging/rpm/preun"
post_uninstall_script = "systemctl daemon-reload >/dev/null 2>&1 || :"
assets = [
    { source = "target/release/kestrel", dest = "/usr/bin/kestrel", mode = "755" },
    { source = "target/release/kestrel-indexd", dest = "/usr/bin/kestrel-indexd", mode = "755" },
    { source = "target/release/ks", dest = "/usr/bin/ks", mode = "755" },
    { source = "../../packaging/excludes", dest = "/etc/kestrel/excludes", mode = "644", config = "noreplace" },
    { source = "../../packaging/kestrel-indexd.service", dest = "/usr/lib/systemd/system/kestrel-indexd.service", mode = "644" },
    { source = "../../packaging/dev.kestrel.Kestrel.desktop", dest = "/usr/share/applications/dev.kestrel.Kestrel.desktop", mode = "644" },
    { source = "../../packaging/dev.kestrel.Kestrel.svg", dest = "/usr/share/icons/hicolor/scalable/apps/dev.kestrel.Kestrel.svg", mode = "644" },
    { source = "../../packaging/kestrel-mime.xml", dest = "/usr/share/mime/packages/kestrel.xml", mode = "644" },
    { source = "../../PLAN.md", dest = "/usr/share/doc/kestrel/PLAN.md", mode = "644", doc = true },
    { source = "../../packaging/7zip/7zz", dest = "/usr/lib/kestrel/7zz", mode = "755" },
    { source = "../../packaging/7zip/License.txt", dest = "/usr/share/doc/kestrel/7zip-License.txt", mode = "644", doc = true },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/kestrel/LICENSE-MIT", mode = "644" },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/kestrel/LICENSE-APACHE", mode = "644" },
    { source = "../../packaging/THIRD-PARTY-LICENSES.txt", dest = "/usr/share/licenses/kestrel/THIRD-PARTY-LICENSES.txt", mode = "644" },
]
auto-req = "builtin"

[package.metadata.generate-rpm.requires]
bubblewrap = "*"
tar = "*"
gzip = "*"
xz = "*"
bzip2 = "*"
zstd = "*"
gvfs = "*"
xdg-utils = "*"
"/usr/bin/pkexec" = "*"

# weak: dnf installs them by default and skips any a distro doesn't have
[package.metadata.generate-rpm.recommends]
gstreamer1-plugins-good = "*"
gstreamer1-plugins-bad-free = "*"
gstreamer1-plugins-ugly-free = "*"
gvfs-smb = "*"
ncompress = "*"
xdg-terminal-exec = "*"
poppler-utils = "*"
libreoffice-writer = "*"
libreoffice-calc = "*"
libreoffice-impress = "*"
