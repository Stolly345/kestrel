# Announce a release on Mastodon, with screenshots from the README.
#
# Needs repo secret MASTODON_TOKEN (mastodon.social > Preferences > Development,
# scopes write:statuses + write:media). Same file in every repo: the app name,
# screenshots and alt text come from the README, hashtags from the repo variable
# MASTODON_HASHTAGS (space-separated; falls back to the repo topics),
# highlights from the release notes' bullet points.
#
# Manual run (Actions tab > Announce release > Run workflow): leave the tag empty
# for the latest release; dry_run (on by default) shows the post without sending.

name: Announce release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = latest release)
        required: false
      dry_run:
        description: Only print the post, don't publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    steps:
      - name: Post to Mastodon
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_INSTANCE: https://mastodon.social
          HASHTAGS: ${{ vars.MASTODON_HASHTAGS }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, posixpath, re, subprocess, tempfile, time, urllib.request

          def gh(path):
              return json.loads(subprocess.run(["gh", "api", path], check=True,
                                               capture_output=True, text=True).stdout)

          def plain(s):  # strip markdown links, emphasis and code marks
              s = re.sub(r"!?\[([^\]]*)\]\([^)]*\)", r"\1", s)
              return re.sub(r"[*_`]", "", s).strip()

          def shorten(s, n):
              return s if len(s) <= n else s[:n - 1].rsplit(" ", 1)[0].rstrip(",;:") + "…"

          repo_full, dry = os.environ["REPO"], os.environ["DRY_RUN"] == "true"
          repo = gh(f"repos/{repo_full}")
          tag = os.environ["TAG"]
          rel = gh(f"repos/{repo_full}/releases/" + (f"tags/{tag}" if tag else "latest"))
          tag = rel["tag_name"]
          readme_meta = gh(f"repos/{repo_full}/readme?ref={tag}")
          readme = base64.b64decode(readme_meta["content"]).decode()
          readme_dir = posixpath.dirname(readme_meta["path"])

          # App name: README title without "(...)" asides, else the repo name.
          m = re.search(r"^#\s+(.+)$|<h1[^>]*>(.*?)</h1>", readme, re.M)
          app = re.sub(r"\s*\(.*?\)", "", plain(m.group(1) or m.group(2))) if m else repo["name"]
          version = tag.lstrip("vV")
          desc = (repo.get("description") or "").strip()

          # Highlights: release-note bullets, each cut to its bold heading
          # ("**Update notice.** ...") or its first clause. To choose the wording
          # yourself, put <!-- announce: line one | line two --> in the notes
          # (invisible on GitHub).
          notes = rel.get("body") or ""
          override = re.search(r"<!--\s*announce:(.*?)-->", notes, re.S)
          highlights = []
          if override:
              highlights = [h.strip() for h in override.group(1).split("|") if h.strip()]
          for ln in [] if override else notes.splitlines():
              b = re.match(r"\s?[-*]\s+(.*)", ln)
              if not b:
                  continue
              text = b.group(1)
              lead = re.match(r"\*\*(.+?[.:])\*\*", text)
              if lead:
                  h = plain(lead.group(1)).rstrip(".:")
              else:
                  t = re.sub(r"\s*\([^)]*\)", "", plain(text))  # drop asides
                  h = re.split(r"\. (?=[A-Z])|: |; |, (?:which|so|but|and then|see) ", t)[0]
              if h:
                  highlights.append(shorten(h.rstrip("."), 90))

          # Package formats attached to the release.
          kinds = {".deb": ".deb", ".rpm": ".rpm", ".appimage": "AppImage",
                   ".flatpak": "Flatpak", ".snap": "Snap", ".exe": "Windows", ".dmg": "macOS"}
          pkgs = []
          for a in rel["assets"]:
              for ext, label in kinds.items():
                  if a["name"].lower().endswith(ext) and label not in pkgs:
                      pkgs.append(label)

          pref = ["linux", "rust", "gtk4", "gnome", "libadwaita"]
          topics = repo.get("topics", [])
          topics = [t for t in pref if t in topics] + [t for t in topics if t not in pref]
          camel = lambda t: "".join(p.capitalize() if p.islower() else p for p in re.split(r"[-_]", t))
          tags = " ".join(dict.fromkeys(["#" + camel(t) for t in topics[:5]] + ["#Linux", "#OpenSource"]))
          if os.environ.get("HASHTAGS", "").strip():  # repo variable MASTODON_HASHTAGS wins
              tags = " ".join("#" + t.lstrip("#") for t in os.environ["HASHTAGS"].replace(",", " ").split())

          # Assemble, fitting as many highlights as Mastodon's 500 chars allow
          # (a link counts as 23).
          url = rel["html_url"]
          def build(hl):
              parts = [f"🚀 {app} {version} is out!", desc]
              if hl:
                  parts.append("What's new:\n" + "\n".join("✨ " + h for h in hl))
              parts.append(("📦 " + " · ".join(pkgs) + "\n" if pkgs else "") + "⬇️ " + url)
              parts.append(tags)
              return "\n\n".join(p for p in parts if p)
          count = lambda t: len(t) - len(url) + 23
          n = min(len(highlights), 4 if override else 3)
          while n and count(build(highlights[:n])) > 500:
              n -= 1
          toot = build(highlights[:n])
          if count(toot) > 500:  # long description: trim it
              desc = shorten(desc, len(desc) - (count(toot) - 500))
              toot = build([])

          # Screenshots: images in the README (not badges or SVGs), up to 4, with alt text.
          images = []
          pat = r"!\[([^\]]*)\]\(([^)\s]+)[^)]*\)|<img\s[^>]*>"
          for mm in re.finditer(pat, readme):
              if mm.group(2):
                  alt, src = mm.group(1), mm.group(2)
              else:
                  tag_html = mm.group(0)
                  src = (re.search(r'src="([^"]+)"', tag_html) or [None, ""])[1]
                  alt = (re.search(r'alt="([^"]*)"', tag_html) or [None, ""])[1]
              low = src.lower().split("?")[0]
              if not re.search(r"\.(png|jpe?g|gif|webp)$", low) or "shields.io" in low:
                  if "user-attachments" not in low:
                      continue
              if not src.startswith("http"):
                  src = (f"https://raw.githubusercontent.com/{repo_full}/{tag}/"
                         + posixpath.normpath(posixpath.join(readme_dir, src)).lstrip("/"))
              if src not in [i[0] for i in images]:
                  images.append((src, alt or f"{app} screenshot"))
              if len(images) == 4:
                  break

          print(f"---- Mastodon post ({count(toot)}/500) ----\n{toot}\n---- images ----")
          for src, alt in images:
              print(f"{src}\n  alt: {alt}")
          if dry:
              print("Dry run: nothing posted.")
              raise SystemExit
          token = os.environ.get("MASTODON_TOKEN")
          if not token:
              raise SystemExit("::error::MASTODON_TOKEN secret is not set")
          api = os.environ["MASTODON_INSTANCE"] + "/api"

          def curl(*args):
              out = subprocess.run(["curl", "-sS", "--fail-with-body",
                                    "-H", f"Authorization: Bearer {token}", *args],
                                   capture_output=True, text=True)
              if out.returncode:
                  raise RuntimeError(out.stdout or out.stderr)
              return json.loads(out.stdout)

          media_ids = []
          for src, alt in images:
              try:
                  with tempfile.NamedTemporaryFile(suffix=posixpath.splitext(src)[1] or ".png") as f:
                      f.write(urllib.request.urlopen(src).read())
                      f.flush()
                      m = curl("-F", f"file=@{f.name}", "-F", f"description={alt[:1500]}",
                               f"{api}/v2/media")
                  for _ in range(30):  # large images are processed asynchronously
                      if m.get("url"):
                          break
                      time.sleep(2)
                      m = curl(f"{api}/v1/media/{m['id']}")
                  media_ids.append(m["id"])
              except Exception as e:
                  print(f"::warning::image skipped ({src}): {e}")

          args = ["-H", f"Idempotency-Key: {repo_full}@{tag}#{os.environ['GITHUB_RUN_ID']}",
                  "--data-urlencode", f"status={toot}", "-d", "visibility=public"]
          for mid in media_ids:
              args += ["-d", f"media_ids[]={mid}"]
          print("Posted:", curl(*args, f"{api}/v1/statuses")["url"], f"with {len(media_ids)} image(s)")
          EOF
